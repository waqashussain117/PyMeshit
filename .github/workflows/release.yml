name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish-pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build numpy twine

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from importlib.metadata import version; import Pymeshit; from Pymeshit import MeshCase, MeshOptions, SurfaceSpec, run_mesh_case; assert Pymeshit.__version__ == version('Pymeshit'); assert callable(run_mesh_case); print(Pymeshit.__version__)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  build-linux-exe:
    name: Build Linux Executable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 libopengl0 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          # Install core dependencies
          python -m pip install numpy scipy matplotlib PySide6 pyvista tetgen triangle netCDF4
          python -m pip install pyvistaqt
          python -m pip install -e .

      - name: Build Executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python build_exe.py --no-clean

      - name: Get version
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create ZIP archive
        run: |
          VER="${{ steps.get_version.outputs.version }}"
          echo "Creating ZIP for version $VER"
          cd release
          zip -r PyMeshit-$VER-linux.zip PyMeshIt
          cd ..

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/PyMeshit-${{ steps.get_version.outputs.version }}-linux.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-exe:
    name: Build Windows EXE and attach to Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          # Install core dependencies first
          python -m pip install numpy scipy matplotlib PySide6 pyvista tetgen triangle netCDF4
          # Install pyvistaqt separately (it has special installation requirements)
          python -m pip install pyvistaqt
          # Install from requirements.txt (excluding problematic packages)
          python -m pip install -e .

      - name: Verify dependencies
        shell: pwsh
        run: |
          Write-Host "Verifying critical dependencies..."
          $failed = $false
          try {
            python -c "import PySide6; print(f'PySide6: {PySide6.__version__}')"
          } catch {
            Write-Host "PySide6 verification failed: $_"
            $failed = $true
          }
          try {
            python -c "import pyvista; print(f'PyVista: {pyvista.__version__}')"
          } catch {
            Write-Host "PyVista verification failed: $_"
            $failed = $true
          }
          try {
            python -c "import pyvistaqt; print(f'PyVistaQt: {pyvistaqt.__version__}')"
          } catch {
            Write-Host "PyVistaQt verification failed: $_"
            Write-Host "This is expected - PyVistaQt may not install on all systems"
          }
          try {
            python -c "import tetgen; print('TetGen: OK')"
          } catch {
            Write-Host "TetGen verification failed: $_"
            $failed = $true
          }
          try {
            python -c "import numpy, scipy, matplotlib; print('Scientific stack: OK')"
          } catch {
            Write-Host "Scientific stack verification failed: $_"
            $failed = $true
          }
          try {
            python -c "import netCDF4; print(f'NetCDF4: {netCDF4.__version__}')"
          } catch {
            Write-Host "NetCDF4 verification failed: $_"
            $failed = $true
          }
          if ($failed) {
            Write-Host "Some critical dependencies failed - continuing anyway"
          } else {
            Write-Host "All dependencies verified successfully"
          }

      - name: Build EXE with PyInstaller helper
        shell: pwsh
        run: |
          python build_exe.py --no-clean

      - name: Check if EXE was created
        shell: pwsh
        run: |
          if (Test-Path release/PyMeshIt/PyMeshIt.exe) {
            Write-Host "EXE found: release/PyMeshIt/PyMeshIt.exe"
            $size = (Get-ChildItem release/PyMeshIt -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
            Write-Host "Directory size: $($size.ToString('F2')) MB"
            Write-Host "Note: Directory-based executable (much less likely to trigger AV false positives)"
          } else {
            Write-Host "EXE not found at release/PyMeshIt/PyMeshIt.exe"
            Write-Host "Contents of release directory:"
            Get-ChildItem release -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          $version = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          Write-Host "Version: $ver"
          if (!(Test-Path release/PyMeshIt)) {
            Write-Host "ERROR: PyMeshIt directory not found!"
            exit 1
          }
          Write-Host "Creating ZIP archive: PyMeshit-$ver-win64.zip"
          Compress-Archive -Path "release/PyMeshIt" -DestinationPath "release/PyMeshit-$ver-win64.zip" -Force
          Write-Host "ZIP archive created successfully"
          $zipSize = (Get-Item "release/PyMeshit-$ver-win64.zip").Length / 1MB
          Write-Host "ZIP size: $($zipSize.ToString('F2')) MB"

      - name: List release files before upload
        shell: pwsh
        run: |
          Write-Host "Files in release directory:"
          Get-ChildItem release -ErrorAction SilentlyContinue
          Write-Host "Looking for: PyMeshit-${{ steps.get_version.outputs.version }}-win64.zip"

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/PyMeshit-${{ steps.get_version.outputs.version }}-win64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-exe:
    name: Build macOS App (${{ matrix.arch }}) and attach to Release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: x86_64
          - os: macos-latest
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          brew install libomp

      - name: Install dependencies and PyInstaller
        env:
          ARCHFLAGS: "-arch ${{ matrix.arch }}"
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            arch -x86_64 python -m pip install --upgrade pip
            arch -x86_64 python -m pip install pyinstaller
            arch -x86_64 python -m pip install numpy scipy matplotlib PySide6 pyvista tetgen triangle netCDF4
            arch -x86_64 python -m pip install pyvistaqt
            arch -x86_64 python -m pip install -e .
          else
            python -m pip install --upgrade pip
            python -m pip install pyinstaller
            python -m pip install numpy scipy matplotlib PySide6 pyvista tetgen triangle netCDF4
            python -m pip install pyvistaqt
            python -m pip install -e .
          fi

      - name: Build macOS app bundle with PyInstaller helper
        env:
          QT_QPA_PLATFORM: offscreen
          ARCHFLAGS: "-arch ${{ matrix.arch }}"
        run: |
          APP_NAME="PyMeshIt-macOS-${{ matrix.arch }}"
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            arch -x86_64 python build_exe.py --no-clean --target-arch "${{ matrix.arch }}" --name "$APP_NAME" --entry-script Pymeshit_workflow_gui.py
          else
            python build_exe.py --no-clean --target-arch "${{ matrix.arch }}" --name "$APP_NAME" --entry-script Pymeshit_workflow_gui.py
          fi

      - name: Check build output
        run: |
          APP_NAME="PyMeshIt-macOS-${{ matrix.arch }}"
          if [ -d "release/${APP_NAME}.app" ]; then
            echo "App bundle found: release/${APP_NAME}.app"
            du -sh "release/${APP_NAME}.app"
          elif [ -d "release/${APP_NAME}" ]; then
            echo "Directory build found: release/${APP_NAME}"
            du -sh "release/${APP_NAME}"
          else
            echo "No macOS output found in release/"
            ls -la release || true
            exit 1
          fi

      - name: Get version
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create ZIP archive
        run: |
          VER="${{ steps.get_version.outputs.version }}"
          APP_NAME="PyMeshIt-macOS-${{ matrix.arch }}"
          if [ -d "release/${APP_NAME}.app" ]; then
            echo "Creating ZIP for app bundle version $VER (${APP_NAME}.app)"
            ditto -c -k --sequesterRsrc --keepParent "release/${APP_NAME}.app" "release/PyMeshit-$VER-macOS-${{ matrix.arch }}.zip"
          else
            echo "Creating ZIP for directory build version $VER (${APP_NAME})"
            cd release
            zip -r "PyMeshit-$VER-macOS-${{ matrix.arch }}.zip" "${APP_NAME}"
            cd ..
          fi

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/PyMeshit-${{ steps.get_version.outputs.version }}-macOS-${{ matrix.arch }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


