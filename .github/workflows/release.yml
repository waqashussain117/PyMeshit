name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish-pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  build-windows-exe:
    name: Build Windows EXE and attach to Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          # Install core dependencies first
          python -m pip install numpy scipy matplotlib PySide6 pyvista tetgen triangle netCDF4
          # Install pyvistaqt separately (it has special installation requirements)
          python -m pip install pyvistaqt
          # Install from requirements.txt (excluding problematic packages)
          python -m pip install -e .

      - name: Verify dependencies
        shell: pwsh
        run: |
          Write-Host "Verifying critical dependencies..."
          $failed = $false
          try {
            python -c "import PySide6; print(f'PySide6: {PySide6.__version__}')"
          } catch {
            Write-Host "PySide6 verification failed: $_"
            $failed = $true
          }
          try {
            python -c "import pyvista; print(f'PyVista: {pyvista.__version__}')"
          } catch {
            Write-Host "PyVista verification failed: $_"
            $failed = $true
          }
          try {
            python -c "import pyvistaqt; print(f'PyVistaQt: {pyvistaqt.__version__}')"
          } catch {
            Write-Host "PyVistaQt verification failed: $_"
            Write-Host "This is expected - PyVistaQt may not install on all systems"
          }
          try {
            python -c "import tetgen; print('TetGen: OK')"
          } catch {
            Write-Host "TetGen verification failed: $_"
            $failed = $true
          }
          try {
            python -c "import numpy, scipy, matplotlib; print('Scientific stack: OK')"
          } catch {
            Write-Host "Scientific stack verification failed: $_"
            $failed = $true
          }
          try {
            python -c "import netCDF4; print(f'NetCDF4: {netCDF4.__version__}')"
          } catch {
            Write-Host "NetCDF4 verification failed: $_"
            $failed = $true
          }
          if ($failed) {
            Write-Host "Some critical dependencies failed - continuing anyway"
          } else {
            Write-Host "All dependencies verified successfully"
          }

      - name: Build EXE with PyInstaller helper
        shell: pwsh
        run: |
          python build_exe.py --no-clean

      - name: Check if EXE was created
        shell: pwsh
        run: |
          if (Test-Path release/PyMeshIt.exe) {
            Write-Host "EXE found: release/PyMeshIt.exe"
            $size = (Get-Item release/PyMeshIt.exe).Length / 1MB
            Write-Host "EXE size: $($size.ToString('F2')) MB"
          } else {
            Write-Host "EXE not found at release/PyMeshIt.exe"
            Write-Host "Contents of release directory:"
            Get-ChildItem release -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          $version = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Rename artifact
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          Write-Host "Version: $ver"
          if (!(Test-Path release/PyMeshIt.exe)) {
            Write-Host "ERROR: PyMeshIt.exe not found!"
            exit 1
          }
          Write-Host "Renaming PyMeshIt.exe to MeshIt-$ver-win64.exe"
          Copy-Item release/PyMeshIt.exe "release/MeshIt-$ver-win64.exe"
          Write-Host "Rename completed successfully"

      - name: List release files before upload
        shell: pwsh
        run: |
          Write-Host "Files in release directory:"
          Get-ChildItem release -ErrorAction SilentlyContinue
          Write-Host "Looking for: MeshIt-${{ steps.get_version.outputs.version }}-win64.exe"

      - name: Upload EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/MeshIt-${{ steps.get_version.outputs.version }}-win64.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


